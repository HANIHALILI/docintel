services:
  mock-vlm:
    build: ./mock-vlm
    container_name: mock-vlm
    ports:
      - "9090:9090" # exposed to the host only for convenience/inspection
    volumes:
      - ./logs:/logs

  # Official XBERG image as a standalone extraction server. docintel calls it
  # over HTTP (fast extraction only — no captioning; our describer owns the VLM).
  # Default entrypoint: `xberg serve --host 0.0.0.0 --port 8000`.
  xberg:
    image: ghcr.io/xberg-io/xberg:1.0.14
    container_name: xberg
    ports:
      - "8000:8000"   # exposed to host for convenience/inspection
    volumes:
      - ./xberg-cache:/cache

  # The real service we're building. Fast parse (via the xberg container over
  # HTTP) + async VLM lane (via the mock). For production drop VLM_BASE_URL +
  # VLM_API_KEY and set OPENAI_API_KEY (or ANTHROPIC_API_KEY) instead.
  docintel:
    build: ./docintel
    container_name: docintel
    ports:
      - "8090:8090"
    environment:
      - PARSER_BACKEND=http
      - XBERG_URL=http://xberg:8000
      - VLM_MODEL=openai/gpt-4o-mini
      - VLM_BASE_URL=http://mock-vlm:9090/v1
      - VLM_API_KEY=mock-key-not-checked
      - VLM_CONCURRENCY=8
      - VLM_MIN_PIXEL_AREA=1000
    depends_on:
      - xberg
      - mock-vlm
