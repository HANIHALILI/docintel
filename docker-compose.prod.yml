# Production-oriented compose: the xberg parser + the docintel service, with a
# REAL VLM. No mock. Secrets come from a .env file (see .env.example).
#
#   cp .env.example .env      # then fill in real VLM_* values
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Only docintel is published to the host (:8090). xberg stays on the internal
# network — docintel reaches it by service name.
services:
  xberg:
    image: ghcr.io/xberg-io/xberg:1.0.14
    restart: unless-stopped
    volumes:
      - xberg-cache:/cache
    # deliberately NOT exposed to the host.

  docintel:
    build: ./docintel
    restart: unless-stopped
    ports:
      - "8090:8090"
    environment:
      - PARSER_BACKEND=http
      - XBERG_URL=http://xberg:8000
      # --- real VLM, from .env ---
      - VLM_MODEL=${VLM_MODEL}
      - VLM_BASE_URL=${VLM_BASE_URL}
      - VLM_API_KEY=${VLM_API_KEY}
      # --- optional tuning (defaults applied if unset) ---
      - VLM_CONCURRENCY=${VLM_CONCURRENCY:-8}
      - VLM_MIN_PIXEL_AREA=${VLM_MIN_PIXEL_AREA:-1000}
      - VLM_TIMEOUT=${VLM_TIMEOUT:-60}
    depends_on:
      - xberg

volumes:
  xberg-cache:
